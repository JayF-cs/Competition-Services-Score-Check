[package]
name = "scores_check"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
futures = "0.3"
anyhow = "1"
chromiumoxide = "0.9.1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = "0.45"
russh-keys = "0.45"
mysql_async = "0.34"
async-trait = "0.1"
ironrdp-pdu = "0.9"
ironrdp-core = "0.2"
native-tls = "0.2"
tokio-native-tls = "0.3"
x509-cert = "0.2"
ironrdp-connector = "0.10.0"
